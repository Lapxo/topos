          0f5b05b2bd1b1f5e3641e6539e61fae87d791c4d51aa5d3d304ffdc064e7fe4d https://github.com/Lapxo/topos-github/releases/download/v0.1.4/0f5b05b2bd1b1f5e3641e6539e61fae87d791c4d51aa5d3d304ffdc064e7fe4d
          159ce79a262e08840b8e79bc7279abaef958e369115062f937fd7bf3bee9bf1e https://github.com/Lapxo/topos-doc/releases/download/v0.1.4/159ce79a262e08840b8e79bc7279abaef958e369115062f937fd7bf3bee9bf1e
