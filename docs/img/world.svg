<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">One standing, many interpretations</title><desc id="desc">Wire, forms, classes and views are parts of a selected topos. Its standing identity is independent of host transport. Artifact dependencies are verified by digest.</desc>
<style>text{font:15px ui-sans-serif,system-ui,sans-serif;fill:#526078}.label{font-size:18px;font-weight:600;fill:#23304c}.caption{font-size:13px}rect{fill:#f6f8fc;stroke:#ccd6e6}path{fill:none;stroke:#8b9cbc;stroke-width:1.6}.pin{fill:#e8e5fa;stroke:#a69cdb}@media(prefers-color-scheme:dark){text{fill:#aab9d1}.label{fill:#e0e8f7}rect{fill:#111d30;stroke:#334660}.pin{fill:#272347;stroke:#7469a7}}</style>
<g><rect x="25" y="22" width="155" height="63" rx="16"/><text class="label" x="46" y="50">Wire</text><text x="46" y="71">record grammar</text>
<rect x="25" y="99" width="155" height="63" rx="16"/><text class="label" x="46" y="127">Forms</text><text x="46" y="148">value interpretation</text>
<rect x="25" y="176" width="155" height="63" rx="16"/><text class="label" x="46" y="204">Classes</text><text x="46" y="225">allowed references</text>
<rect x="25" y="253" width="155" height="63" rx="16"/><text class="label" x="46" y="281">Views</text><text x="46" y="302">result presentation</text></g>
<path d="M180 54 C250 54 240 170 300 170 M180 131 C250 131 240 170 300 170 M180 208 C250 208 240 170 300 170 M180 285 C250 285 240 170 300 170"/>
<rect class="pin" x="300" y="121" width="190" height="98" rx="24"/><text class="label" x="326" y="156">Folded standing</text><text x="326" y="181">canonical live claims</text><text x="326" y="203">selected by digest</text>
<path d="M490 170 C525 170 524 95 565 95 M490 170 C525 170 524 255 565 255"/>
<rect x="565" y="54" width="170" height="80" rx="18"/><text class="label" x="584" y="87">Interpretation</text><text x="584" y="111">no runtime required</text>
<rect x="565" y="214" width="170" height="80" rx="18"/><text class="label" x="584" y="248">Host</text><text x="584" y="272">resolve artifact bytes</text>
<text class="caption" x="301" y="260">A capsule is an offer.</text><text class="caption" x="301" y="280">It is not the identity of the topos.</text>
