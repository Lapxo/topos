name: release
on:
  release:
    types: [published]
jobs:
  stage:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          set -euo pipefail
          npm ci
          npm run build
      - run: |
          set -euo pipefail
          npm install --global npm@12.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/approved-release"
          approval="$RUNNER_TEMP/approved-release/approval"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'approval' --dir "$RUNNER_TEMP/approved-release"
          printf '%s  %s\n' 'd346f3216a7ab42aebe667a84e159c712c0fcda16471046a4f0268a8b4558c0a' "$approval" | sha256sum -c -
          printf 'SOURCE github:%s/%s/%s · sha256:%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" 'approval' 'd346f3216a7ab42aebe667a84e159c712c0fcda16471046a4f0268a8b4558c0a'
          export APPROVAL_FILE="$approval"
          node --input-type=module > "$RUNNER_TEMP/approved-release/artifact.tsv" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {parse} from './dist/wire/index.js';
          const rows=readFileSync(process.env.APPROVAL_FILE,'utf8').split('\n').filter(Boolean).map(line=>{const got=parse(line);if(got.kind!=='fact')throw Error('REFUSE·release approval wire');return got.value.fields;});
          const one=scope=>{const selected=rows.filter(r=>r.scope===scope&&r.role==='writes'&&r.value!=='withdraw');if(selected.length!==1)throw Error('REFUSE·release '+scope+' needs one declaration');return selected[0].value;};
          const digest=one('release/'+process.env.RELEASE_TAG),name=one('release/artifact'),source=one('sources/archive');
          if(!/^sha256:[a-f0-9]{64}$/.test(digest)||!/^[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$/.test(name))throw Error('REFUSE·release approved archive identity');
          const url=new URL(source);if(url.protocol!=='https:'||url.username||url.password||/[\r\n\t]/.test(source))throw Error('REFUSE·release archive source');
          console.log([digest.slice(7),name,source].join('\t'));
          NODE
          IFS=$'\t' read -r expected name source < "$RUNNER_TEMP/approved-release/artifact.tsv"
          asset="$RUNNER_TEMP/approved-release/$name"
          if test -f "$asset"; then
            served="laid:$asset"
          else
            served="$source"
            curl --fail --location --proto '=https' --proto-redir '=https' --max-time 30 --max-filesize 67108864 --output "$asset" "$source"
          fi
          printf '%s  %s\n' "$expected" "$asset" | sha256sum -c -
          printf 'SOURCE %s · sha256:%s\n' "$served" "$expected"
          npm stage publish "$asset" --access public --ignore-scripts
