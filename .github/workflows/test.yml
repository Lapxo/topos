          970329e0f95d38fefd6589d207c84d363ef5f5f02ae203dfa95c68b266129c00 https://github.com/Lapxo/topos/releases/download/v0.2.4/970329e0f95d38fefd6589d207c84d363ef5f5f02ae203dfa95c68b266129c00.tgz
          92ffa39ee4def8f12fb54a73816b665aca532f0d5682180492373d4f78a7bdc9 https://github.com/Lapxo/topos/releases/download/v0.2.4/92ffa39ee4def8f12fb54a73816b665aca532f0d5682180492373d4f78a7bdc9.bound
          705622ba3ab39c76f26f3adfc7de6fcbcaf69dc7d97c2fb105fcc8c9f5016f61 https://github.com/Lapxo/topos/releases/download/v0.2.4/705622ba3ab39c76f26f3adfc7de6fcbcaf69dc7d97c2fb105fcc8c9f5016f61.tgz
          741de039e88ab1e3e02278c1de9a9b7cfe93407e71454023422e2b697cb64865 https://github.com/Lapxo/topos/releases/download/v0.2.4/741de039e88ab1e3e02278c1de9a9b7cfe93407e71454023422e2b697cb64865.bound
          c1b4f9cd36f17bce5a5e21b3176378996302a318f3e08f7abe054b72a8fca90c https://github.com/Lapxo/topos/releases/download/v0.2.4/c1b4f9cd36f17bce5a5e21b3176378996302a318f3e08f7abe054b72a8fca90c.tgz
          ASSETS
      - name: Check native closure and file seals
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/instrument/node_modules/@lapxo/bound/dist/cli/verb.js" fold --check
      - name: Inspect the declared package members
        run: npm pack --dry-run --ignore-scripts --json
