name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Install the declared verification instrument
        run: npm install --prefix "$RUNNER_TEMP/instrument" --no-save --ignore-scripts @lapxo/bound@0.2.5
      - name: Resolve the declared public inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readers" .bound/cas/blobs
          while read -r digest source; do
            asset="${source##*/}"
            case "$source" in
              https://github.com/Lapxo/topos/releases/download/v0.2.4/*)
                gh release download v0.2.4 --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/readers" ;;
              *) curl --fail --location --retry 3 "$source" --output "$RUNNER_TEMP/readers/$asset" ;;
            esac
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/readers/$asset" | sha256sum -c -
            cp "$RUNNER_TEMP/readers/$asset" ".bound/cas/blobs/$digest"
          done <<'ASSETS'
          907115916d64425dd23305fc74d91ea937f933de4949fb0c4dc94fb1106bd33e https://github.com/Lapxo/topos/releases/download/v0.1.13/907115916d64425dd23305fc74d91ea937f933de4949fb0c4dc94fb1106bd33e
